<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>สื่อการเรียนรู้คำศัพท์ภาษาไทย ป.1 — เล่มที่ 23 ตอนที่ 1</title>
    <meta name="description" content="สื่อ Interactive Media สำหรับสอนคำศัพท์ภาษาไทย ระดับชั้นประถมศึกษาปีที่ 1 เล่มที่ 23 ภาพที่ 1 หัวเราะ หา หาง หาม หิน หิว">

    <!-- ใช้ฟอนต์ Prompt จาก Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;600;700;800;900&display=swap" rel="stylesheet">

    <style>
        /* ===== รีเซ็ตค่าเริ่มต้น ===== */
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* ===== ตัวแปร CSS สำหรับธีมสีสันสดใส ===== */
        :root {
            --color-primary: #FF6B9D;
            --color-secondary: #4ECDC4;
            --color-accent: #FFE66D;
            --color-purple: #A06CD5;
            --color-orange: #FF8A5C;
            --color-blue: #45B7D1;
            --color-green: #7BC950;
            --color-dark: #2D3436;
            --color-white: #FFFFFF;
            --font-main: 'Prompt', 'Noto Sans Thai', sans-serif;
            --shadow-soft: 0 4px 15px rgba(0, 0, 0, 0.1);
            --shadow-popup: 0 10px 40px rgba(0, 0, 0, 0.3);
            --border-radius: 20px;
            --transition-smooth: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        body {
            font-family: var(--font-main);
            /* พื้นหลัง gradient สีม่วง-น้ำเงิน ตามโจทย์ */
            background: linear-gradient(135deg, #667EEA 0%, #764BA2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        /* ===== ส่วนหัวข้อ ===== */
        .header {
            text-align: center;
            padding: 15px 20px;
            width: 100%;
            max-width: 1200px;
        }

        .header h1 {
            font-size: clamp(1.5rem, 4vw, 2.5rem);
            font-weight: 900;
            color: var(--color-white);
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            letter-spacing: 2px;
            animation: titleBounce 2s ease-in-out infinite;
        }

        /* ===== ภาชนะหลักที่ครอบภาพ ===== */
        .image-container {
            position: relative;
            width: 95%;
            max-width: 1100px;
            margin: 10px auto;
            border-radius: var(--border-radius);
            overflow: hidden;
            box-shadow: var(--shadow-popup);
            border: 5px solid var(--color-accent); /* ขอบสีเหลืองทอง */
            background: var(--color-white);
        }

        /* ===== ภาพพื้นหลัง ===== */
        .image-container img.bg-image {
            width: 100%;
            height: auto;
            display: block;
            user-select: none;
            -webkit-user-drag: none;
            pointer-events: none;
        }

        /* ===== Hotspot Overlay ===== */
        .hotspot-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        /* ===== สไตล์ของ Hotspot ===== */
        .hotspot {
            position: absolute;
            cursor: pointer;
            border-radius: 50%;
            transition: var(--transition-smooth);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
            background: radial-gradient(circle, rgba(255, 230, 109, 0.7) 0%, rgba(255, 107, 157, 0.4) 60%, transparent 70%);
            border: 3px solid rgba(255, 255, 255, 0.8);
            animation: hotspotPulse 2s ease-in-out infinite;
        }

        .hotspot:hover {
            transform: scale(1.2);
            background: radial-gradient(circle, rgba(255, 230, 109, 0.9) 0%, rgba(255, 107, 157, 0.6) 60%, transparent 70%);
            border-color: var(--color-accent);
            box-shadow: 0 0 25px rgba(255, 230, 109, 0.8), 0 0 50px rgba(255, 107, 157, 0.4);
        }

        .hotspot:active {
            transform: scale(0.95);
        }

        /* ===== ไอคอนดาว ===== */
        .hotspot .star-icon {
            font-size: clamp(16px, 2.5vw, 28px);
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
            animation: starSpin 3s linear infinite;
        }

        /* ===== Hotspot ที่ถูกเลือก ===== */
        .hotspot.active {
            animation: hotspotActive 0.6s ease-in-out;
            background: radial-gradient(circle, rgba(78, 205, 196, 0.9) 0%, rgba(78, 205, 196, 0.4) 60%, transparent 70%);
            border-color: var(--color-secondary);
            box-shadow: 0 0 30px rgba(78, 205, 196, 0.9), 0 0 60px rgba(78, 205, 196, 0.5);
            transform: scale(1.3);
        }

        /* ===== ป้ายแสดงคำศัพท์ ===== */
        .vocab-popup {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            z-index: 1000;
            background: linear-gradient(135deg, var(--color-primary) 0%, var(--color-purple) 100%);
            color: var(--color-white);
            padding: 30px 60px;
            border-radius: 30px;
            font-size: clamp(3rem, 10vw, 6rem);
            font-weight: 900;
            text-align: center;
            box-shadow: var(--shadow-popup), 0 0 80px rgba(255, 107, 157, 0.5);
            border: 5px solid rgba(255, 255, 255, 0.5);
            opacity: 0;
            pointer-events: none;
            transition: none;
            letter-spacing: 8px;
            text-shadow: 3px 3px 10px rgba(0,0,0,0.3);
            backdrop-filter: blur(10px);
        }

        .vocab-popup.show {
            animation: popupShow 2.5s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
        }

        /* ===== แถบคำศัพท์ที่เรียนแล้ว ===== */
        .progress-bar {
            width: 95%;
            max-width: 1100px;
            margin: 10px auto;
            padding: 12px 20px;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            border: 2px solid rgba(255, 255, 255, 0.6);
            box-shadow: var(--shadow-soft);
        }

        .progress-bar .label {
            font-size: clamp(0.8rem, 1.8vw, 1rem);
            color: var(--color-dark);
            font-weight: 700;
            white-space: nowrap;
        }

        /* ===== ปุ่มคำศัพท์ ===== */
        .vocab-badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 8px 18px;
            border-radius: 25px;
            font-size: clamp(0.9rem, 2vw, 1.2rem);
            font-weight: 700;
            color: var(--color-dark);
            background: rgba(255, 255, 255, 0.7);
            border: 2px solid rgba(255, 255, 255, 0.8);
            transition: var(--transition-smooth);
            cursor: pointer;
            user-select: none;
        }

        .vocab-badge.learned {
            background: linear-gradient(135deg, var(--color-secondary), var(--color-green));
            color: var(--color-white);
            border-color: var(--color-green);
            box-shadow: 0 2px 10px rgba(123, 201, 80, 0.4);
        }

        .vocab-badge:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .vocab-badge:active {
            transform: translateY(0);
        }

        /* ===== ปุ่มรีเซ็ต ===== */
        .reset-btn {
            position: fixed;
            bottom: 15px;
            right: 15px;
            z-index: 100;
            background: linear-gradient(135deg, var(--color-orange), var(--color-primary));
            color: var(--color-white);
            border: none;
            border-radius: 50px;
            padding: 12px 24px;
            font-size: clamp(0.8rem, 1.8vw, 1rem);
            font-weight: 700;
            font-family: var(--font-main);
            cursor: pointer;
            box-shadow: var(--shadow-soft);
            transition: var(--transition-smooth);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .reset-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(255, 138, 92, 0.5);
        }

        .reset-btn:active {
            transform: scale(0.97);
        }

        /* ===== คำแนะนำ ===== */
        .instruction {
            text-align: center;
            padding: 8px;
            font-size: clamp(0.85rem, 2vw, 1.1rem);
            color: var(--color-white);
            font-weight: 600;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.5);
        }

        .instruction .hand-icon {
            font-size: 1.3em;
            animation: handWave 1.5s ease-in-out infinite;
            display: inline-block;
        }

        /* ===== หน้าจอแสดงเมื่อเรียนครบ ===== */
        .congrats-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(8px);
            z-index: 2000;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
        }

        .congrats-overlay.show {
            opacity: 1;
            pointer-events: all;
        }

        .congrats-card {
            background: linear-gradient(135deg, #FFE66D, #FF6B9D, #A06CD5, #4ECDC4);
            background-size: 400% 400%;
            animation: gradientShift 4s ease infinite;
            padding: 40px 50px;
            border-radius: 30px;
            text-align: center;
            color: var(--color-white);
            box-shadow: 0 20px 60px rgba(0,0,0,0.4);
            max-width: 90%;
            border: 5px solid rgba(255,255,255,0.5);
        }

        .congrats-card h2 {
            font-size: clamp(2rem, 6vw, 3.5rem);
            font-weight: 900;
            text-shadow: 3px 3px 6px rgba(0,0,0,0.3);
            margin-bottom: 10px;
        }

        .congrats-card p {
            font-size: clamp(1rem, 3vw, 1.5rem);
            font-weight: 600;
            margin-bottom: 20px;
        }

        .congrats-card button {
            background: var(--color-white);
            color: var(--color-primary);
            border: none;
            padding: 15px 40px;
            border-radius: 50px;
            font-size: clamp(1rem, 2.5vw, 1.3rem);
            font-weight: 800;
            font-family: var(--font-main);
            cursor: pointer;
            transition: var(--transition-smooth);
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .congrats-card button:hover {
            transform: scale(1.05);
        }

        /* ===== Confetti ===== */
        .confetti {
            position: fixed;
            top: -10px;
            z-index: 2001;
            width: 12px;
            height: 12px;
            border-radius: 3px;
            animation: confettiFall linear forwards;
            pointer-events: none;
        }

        /* ===== Animations ===== */
        @keyframes titleBounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }

        @keyframes hotspotPulse {
            0%, 100% {
                box-shadow: 0 0 10px rgba(255, 230, 109, 0.4);
                opacity: 0.85;
            }
            50% {
                box-shadow: 0 0 25px rgba(255, 230, 109, 0.7), 0 0 50px rgba(255, 107, 157, 0.3);
                opacity: 1;
            }
        }

        @keyframes hotspotActive {
            0% { transform: scale(1); }
            30% { transform: scale(1.5); }
            100% { transform: scale(1.3); }
        }

        @keyframes starSpin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes popupShow {
            0% {
                transform: translate(-50%, -50%) scale(0) rotate(-10deg);
                opacity: 0;
            }
            15% {
                transform: translate(-50%, -50%) scale(1.15) rotate(3deg);
                opacity: 1;
            }
            25% {
                transform: translate(-50%, -50%) scale(1) rotate(0deg);
                opacity: 1;
            }
            75% {
                transform: translate(-50%, -50%) scale(1) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translate(-50%, -60%) scale(0.8) rotate(5deg);
                opacity: 0;
            }
        }

        @keyframes handWave {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(20deg); }
            75% { transform: rotate(-10deg); }
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes confettiFall {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
        }

        /* ===== Responsive ===== */
        @media (max-width: 600px) {
            .header { padding: 10px 15px; }
            .image-container { width: 98%; border-width: 3px; }
            .vocab-popup { padding: 20px 40px; }
            .progress-bar { padding: 8px 12px; gap: 6px; }
            .vocab-badge { padding: 6px 12px; }
            .reset-btn { padding: 10px 18px; bottom: 10px; right: 10px; }
        }
    </style>
</head>
<body>

    <!-- ===== ส่วนหัว ===== -->
    <div class="header">
        <h1>📚 เรียนรู้คำศัพท์ภาษาไทย 📚</h1>
    </div>

    <!-- ===== คำแนะนำ ===== -->
    <div class="instruction">
        <span class="hand-icon">👆</span> แตะที่ <strong>ดาว ⭐</strong> บนรูปภาพเพื่อเรียนรู้คำศัพท์กันเถอะ!
    </div>

    <!-- ===== ภาชนะรูปภาพและ Hotspot ===== -->
    <div class="image-container" id="imageContainer">
        <!-- ภาพพื้นหลัง -->
        <img
            src="1 หัวเราะ หา.jpeg"
            alt="หัวเราะ หา หาง หาม หิน หิว"
            class="bg-image"
            id="bgImage"
        >

        <!-- ===== Hotspot Overlay ===== -->
        <div class="hotspot-overlay" id="hotspotOverlay">
            
            <!-- จุดที่ 1: หัวเราะ - เด็กผู้หญิงนั่งหัวเราะอย่างมีความสุขบนม้านั่ง -->
            <div
                class="hotspot"
                data-word="หัวเราะ"
                style="top: 25%; left: 38%; width: 10%; height: 20%; border-radius: 50%;"
                id="hotspot-หัวเราะ"
                role="button"
                aria-label="หัวเราะ"
                tabindex="0"
            >
                <span class="star-icon">⭐</span>
            </div>

            <!-- จุดที่ 2: หา - เด็กผู้หญิงนั่งยองๆ กำลังหากลุ่มหิน (หาแมว) -->
            <div
                class="hotspot"
                data-word="หา"
                style="top: 70%; left: 52%; width: 10%; height: 15%; border-radius: 40%;"
                id="hotspot-หา"
                role="button"
                aria-label="หา"
                tabindex="0"
            >
                <span class="star-icon">⭐</span>
            </div>
            
            <!-- จุดที่ 3: หาง - หางแมวที่โผล่ออกมาจากกองหิน -->
            <div
                class="hotspot"
                data-word="หาง"
                style="top: 88%; left: 77%; width: 8%; height: 8%; border-radius: 50%;"
                id="hotspot-หาง"
                role="button"
                aria-label="หาง"
                tabindex="0"
            >
                <span class="star-icon">⭐</span>
            </div>

            <!-- จุดที่ 4: หาม - เด็กผู้ชายสองคนกำลังช่วยกันหามม้านั่ง -->
            <div
                class="hotspot"
                data-word="หาม"
                style="top: 41%; left: 56%; width: 12%; height: 10%; border-radius: 30%;"
                id="hotspot-หาม"
                role="button"
                aria-label="หาม"
                tabindex="0"
            >
                <span class="star-icon">⭐</span>
            </div>

            <!-- จุดที่ 5: หิน - กองหินที่แมวซ่อนอยู่ -->
            <div
                class="hotspot"
                data-word="หิน"
                style="top: 75%; left: 65%; width: 10%; height: 15%; border-radius: 50%;"
                id="hotspot-หิน"
                role="button"
                aria-label="หิน"
                tabindex="0"
            >
                <span class="star-icon">⭐</span>
            </div>

            <!-- จุดที่ 6: หิว - คุณยายท่าทางหิวกำลังถือถ้วยชามเปล่า -->
            <div
                class="hotspot"
                data-word="หิว"
                style="top: 55%; left: 81%; width: 10%; height: 20%; border-radius: 40%;"
                id="hotspot-หิว"
                role="button"
                aria-label="หิว"
                tabindex="0"
            >
                <span class="star-icon">⭐</span>
            </div>

        </div>
    </div>

    <!-- ===== ป้ายแสดงคำศัพท์ (Pop-up) ===== -->
    <div class="vocab-popup" id="vocabPopup"></div>

    <!-- ===== แถบแสดงความก้าวหน้า ===== -->
    <div class="progress-bar" id="progressBar">
        <span class="label">🌟 คำที่เรียนแล้ว:</span>
    </div>

    <!-- ===== ปุ่มเริ่มใหม่ ===== -->
    <button class="reset-btn" id="resetBtn" aria-label="เริ่มใหม่">
        🔄 เริ่มใหม่
    </button>

    <!-- ===== หน้าจอแสดงเมื่อเรียนครบทุกคำ ===== -->
    <div class="congrats-overlay" id="congratsOverlay">
        <div class="congrats-card">
            <h2>🎉 เก่งมาก! 🎉</h2>
            <p>หนูเรียนรู้คำศัพท์ครบทุกคำแล้ว!</p>
            <p style="font-size: clamp(2rem, 5vw, 3rem);">🌟⭐🏆⭐🌟</p>
            <button id="congratsCloseBtn">เล่นอีกครั้ง 🔁</button>
        </div>
    </div>

    <script>
        // ╔══════════════════════════════════════════════════════════════╗
        // ║  โปรแกรม Interactive Media สำหรับสอนคำศัพท์ภาษาไทย ป.1      ║
        // ║  เล่มที่ 23 ภาพที่ 1: หัวเราะ หา หาง หาม หิน หิว                              ║
        // ║  พัฒนาด้วย HTML, CSS, JavaScript (ไฟล์เดียว)                ║
        // ║  ใช้ Web Speech API สำหรับอ่านออกเสียงภาษาไทย               ║
        // ╚══════════════════════════════════════════════════════════════╝

        // ===== รายการคำศัพท์ทั้งหมดที่ใช้ในบทเรียน =====
        const ALL_WORDS = ['หัวเราะ', 'หา', 'หาง', 'หาม', 'หิน', 'หิว'];

        // ===== เก็บรายการคำศัพท์ที่เรียนแล้ว =====
        let learnedWords = new Set();

        // ===== อ้างอิง DOM Elements =====
        const vocabPopup = document.getElementById('vocabPopup');
        const progressBar = document.getElementById('progressBar');
        const congratsOverlay = document.getElementById('congratsOverlay');
        const congratsCloseBtn = document.getElementById('congratsCloseBtn');
        const resetBtn = document.getElementById('resetBtn');
        const hotspots = document.querySelectorAll('.hotspot');

        // ===== ตัวแปรควบคุมการแสดง popup =====
        let isPopupShowing = false;
        let popupTimeout = null;

        // ===== ฟังก์ชันสร้างปุ่มคำศัพท์ในแถบความก้าวหน้า =====
        function createProgressBadges() {
            // ลบปุ่มเก่าออกก่อน (เก็บ label ไว้)
            const existingBadges = progressBar.querySelectorAll('.vocab-badge');
            existingBadges.forEach(b => b.remove());

            // สร้างปุ่มใหม่สำหรับแต่ละคำศัพท์
            ALL_WORDS.forEach(word => {
                const badge = document.createElement('span');
                badge.className = 'vocab-badge' + (learnedWords.has(word) ? ' learned' : '');
                badge.textContent = (learnedWords.has(word) ? '✅ ' : '⬜ ') + word;
                badge.setAttribute('role', 'button');
                badge.setAttribute('aria-label', 'ฟังคำว่า ' + word);
                badge.setAttribute('tabindex', '0');

                // คลิกที่ปุ่มเพื่อฟังเสียงซ้ำ
                badge.addEventListener('click', () => speakWord(word));
                badge.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter' || e.key === ' ') {
                        e.preventDefault();
                        speakWord(word);
                    }
                });

                progressBar.appendChild(badge);
            });
        }

        // ===== ฟังก์ชันอ่านออกเสียงคำศัพท์ด้วย Web Speech API =====
        function speakWord(word) {
            // หยุดเสียงที่กำลังพูดอยู่ก่อน (ถ้ามี)
            window.speechSynthesis.cancel();

            // สร้างคำพูดใหม่
            const utterance = new SpeechSynthesisUtterance(word);
            utterance.lang = 'th-TH';           // ภาษาไทย
            utterance.rate = 0.7;                 // ความเร็วช้าลง (เหมาะกับเด็ก ป.1)
            utterance.pitch = 1.1;                // เสียงสูงขึ้นเล็กน้อย (เสียงผู้หญิง)
            utterance.volume = 1.0;               // ระดับเสียงเต็ม

            // พยายามเลือกเสียงผู้หญิงภาษาไทย (ถ้ามี)
            const voices = window.speechSynthesis.getVoices();
            const thaiVoice = voices.find(v =>
                v.lang.startsWith('th') && v.name.toLowerCase().includes('female')
            ) || voices.find(v =>
                v.lang.startsWith('th')
            );

            if (thaiVoice) {
                utterance.voice = thaiVoice;
            }

            // เริ่มพูด
            window.speechSynthesis.speak(utterance);
        }

        // ===== ฟังก์ชันแสดง popup คำศัพท์ =====
        function showVocabPopup(word) {
            // ยกเลิก timeout เก่า (ถ้ามี)
            if (popupTimeout) {
                clearTimeout(popupTimeout);
            }

            // รีเซ็ต animation
            vocabPopup.classList.remove('show');
            vocabPopup.textContent = word;

            // บังคับ reflow เพื่อรีเซ็ต animation
            void vocabPopup.offsetWidth;

            // แสดง popup ด้วย animation
            vocabPopup.classList.add('show');
            isPopupShowing = true;

            // ซ่อน popup หลังจาก 2.5 วินาที
            popupTimeout = setTimeout(() => {
                vocabPopup.classList.remove('show');
                isPopupShowing = false;
            }, 2500);
        }

        // ===== ฟังก์ชันไฮไลต์ Hotspot ที่ถูกเลือก =====
        function highlightHotspot(hotspotElement) {
            // ลบ active class จากทุก hotspot ก่อน
            hotspots.forEach(h => h.classList.remove('active'));
            // เพิ่ม active class ให้ hotspot ที่ถูกเลือก
            hotspotElement.classList.add('active');

            // ลบ active class หลังจาก 2.5 วินาที
            setTimeout(() => {
                hotspotElement.classList.remove('active');
            }, 2500);
        }

        // ===== ฟังก์ชันตรวจสอบว่าเรียนครบทุกคำหรือยัง =====
        function checkCompletion() {
            if (learnedWords.size === ALL_WORDS.length) {
                setTimeout(() => {
                    congratsOverlay.classList.add('show');
                    createConfetti();
                    speakWord('เก่งมาก');
                }, 2800);
            }
        }

        // ===== ฟังก์ชันสร้าง confetti =====
        function createConfetti() {
            const colors = ['#FF6B9D', '#4ECDC4', '#FFE66D', '#A06CD5', '#FF8A5C', '#45B7D1', '#7BC950'];
            for (let i = 0; i < 60; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.left = Math.random() * 100 + '%';
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.animationDuration = (Math.random() * 2 + 2) + 's';
                confetti.style.animationDelay = Math.random() * 1.5 + 's';
                confetti.style.width = (Math.random() * 10 + 6) + 'px';
                confetti.style.height = (Math.random() * 10 + 6) + 'px';
                confetti.style.borderRadius = Math.random() > 0.5 ? '50%' : '3px';
                document.body.appendChild(confetti);
                setTimeout(() => confetti.remove(), 5000);
            }
        }

        // ===== ฟังก์ชันรีเซ็ต =====
        function resetGame() {
            learnedWords.clear();
            createProgressBadges();
            congratsOverlay.classList.remove('show');
            hotspots.forEach(h => h.classList.remove('active'));
            vocabPopup.classList.remove('show');
            if (popupTimeout) clearTimeout(popupTimeout);
            isPopupShowing = false;
            document.querySelectorAll('.confetti').forEach(c => c.remove());
        }

        // ===== ฟังก์ชันจัดการเมื่อคลิก Hotspot =====
        function handleHotspotClick(event) {
            const hotspot = event.currentTarget;
            const word = hotspot.getAttribute('data-word');

            if (!word) return;

            // 1. ไฮไลต์ Hotspot ที่ถูกเลือก
            highlightHotspot(hotspot);

            // 2. แสดง popup คำศัพท์
            showVocabPopup(word);

            // 3. อ่านออกเสียงคำศัพท์
            speakWord(word);

            // 4. เพิ่มคำศัพท์ลงในรายการที่เรียนแล้ว
            learnedWords.add(word);

            // 5. อัปเดตแถบความก้าวหน้า
            createProgressBadges();

            // 6. ตรวจสอบว่าเรียนครบหรือยัง
            checkCompletion();
        }

        // ===== ผูก Event Listener ให้ทุก Hotspot =====
        hotspots.forEach(hotspot => {
            // คลิกเมาส์ + จอสัมผัส
            hotspot.addEventListener('click', handleHotspotClick);

            // รองรับคีย์บอร์ด (Accessibility)
            hotspot.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    handleHotspotClick(e);
                }
            });
        });

        // ===== ปุ่มรีเซ็ต =====
        resetBtn.addEventListener('click', resetGame);

        // ===== ปุ่มปิดหน้าจอแสดงความยินดี =====
        congratsCloseBtn.addEventListener('click', resetGame);

        // ===== โหลด Voices สำหรับ TTS =====
        if (window.speechSynthesis) {
            window.speechSynthesis.onvoiceschanged = () => {
                window.speechSynthesis.getVoices();
            };
            window.speechSynthesis.getVoices();
        }

        // ===== สร้างปุ่มคำศัพท์ตอนเริ่มต้น =====
        createProgressBadges();

        // ===== ปรับ border-radius ถ้า width ≠ height =====
        hotspots.forEach(h => {
            const w = parseFloat(h.style.width);
            const ht = parseFloat(h.style.height);
            if (Math.abs(w - ht) > 3) {
                h.style.borderRadius = '35%';
            }
        });

        // ===== แจ้งเตือนถ้า Browser ไม่รองรับ Speech Synthesis =====
        if (!('speechSynthesis' in window)) {
            console.warn('⚠️ เบราว์เซอร์นี้ไม่รองรับ Web Speech API');
            const warning = document.createElement('div');
            warning.style.cssText = 'position:fixed;top:10px;left:50%;transform:translateX(-50%);background:#FF6B9D;color:white;padding:10px 20px;border-radius:10px;font-size:14px;z-index:9999;font-family:var(--font-main);';
            warning.textContent = '⚠️ เบราว์เซอร์นี้ไม่รองรับการอ่านออกเสียง กรุณาใช้ Chrome หรือ Edge';
            document.body.appendChild(warning);
            setTimeout(() => warning.remove(), 8000);
        }
    </script>

</body>
</html>
